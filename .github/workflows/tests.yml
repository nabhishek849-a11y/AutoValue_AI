name: AutoValue AI - Tests and Real-Data Training

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py train.py src/*.py tests/*.py

      - name: Run tests
        run: python -m pytest -v

      - name: Train and evaluate real listing models
        run: |
          python train.py --data datasets/clean_used_cars.csv

      - name: Verify trained model and prediction
        run: |
          python - <<'PY'
          from src.valuation import load_model, predict_price, load_sample_data
          from src.schema import FEATURE_COLUMNS

          model = load_model("models/used_car_model.joblib")
          assert model is not None, "Model artifact was not saved"

          data = load_sample_data()
          record = data[FEATURE_COLUMNS].iloc[0].to_dict()
          price = predict_price(model, record)

          assert price > 0, f"Invalid prediction: {price}"
          print(f"Model prediction successful: INR {price:,.2f}")
          PY

      - name: Upload model evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: autovalue-model-evaluation
          path: reports/model_metrics.json
          if-no-files-found: error
